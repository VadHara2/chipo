[versions]
kotlin = "2.4.21"
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"
jackson = "2.22.3"
jackson3 = "3.2.3"
jakarta = "6.1.0"
jwt = "0.13.0"
okhttp = "5.5.0"
firebase = "9.11.0"
kotlinx-coroutines = "1.11.0"

[libraries]
# Build logic
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen-plugin = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
spring-dependency-management-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "spring-dependency-management" }

# Spring Boot (versions managed by its BOM)
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-amqp = { module = "org.springframework.boot:spring-boot-starter-amqp" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-websocket = { module = "org.springframework.boot:spring-boot-starter-websocket" }
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-thymeleaf = { module = "org.springframework.boot:spring-boot-starter-thymeleaf" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-crypto = { module = "org.springframework.security:spring-security-crypto" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
thymeleaf-extras-springsecurity6 = { module = "org.thymeleaf.extras:thymeleaf-extras-springsecurity6" }

# JWT
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api", version.ref = "jakarta" }
jwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jwt" }
jwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jwt" }
jwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jwt" }

# Jackson 2 for JJWT; Jackson 3 for Spring Boot 4 HTTP JSON
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
jackson3-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin", version.ref = "jackson3" }

# Kotlin
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib" }
kotlinx-coroutines-reactor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor", version.ref = "kotlinx-coroutines" }

# Database
postgresql = { module = "org.postgresql:postgresql" }

# HTTP
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

# Firebase
firebase-admin-sdk = { module = "com.google.firebase:firebase-admin", version.ref = "firebase" }

# Test
h2 = { module = "com.h2database:h2" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }
spring-rabbit-test = { module = "org.springframework.amqp:spring-rabbit-test" }
spring-restdocs-mockmvc = { module = "org.springframework.restdocs:spring-restdocs-mockmvc" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
spring-boot-test-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator-test" }
spring-boot-test-amqp = { module = "org.springframework.boot:spring-boot-starter-amqp-test" }
spring-boot-test-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
spring-boot-test-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis-test" }
spring-boot-test-mail = { module = "org.springframework.boot:spring-boot-starter-mail-test" }
spring-boot-test-security = { module = "org.springframework.boot:spring-boot-starter-security-test" }
spring-boot-test-thymeleaf = { module = "org.springframework.boot:spring-boot-starter-thymeleaf-test" }
spring-boot-test-validation = { module = "org.springframework.boot:spring-boot-starter-validation-test" }
spring-boot-test-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-test-websocket = { module = "org.springframework.boot:spring-boot-starter-websocket-test" }

[plugins]
chirp-kotlin-common = { id = "chirp.kotlin-common" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
